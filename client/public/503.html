<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SharaForms is temporarily unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      .card {
        max-width: 42rem;
        margin: 2rem;
        padding: 2rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
      }

      p {
        line-height: 1.6;
        margin: 0.75rem 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>We are performing maintenance</h1>
      <p>SharaForms is temporarily unavailable while we finish a maintenance task.</p>
      <p>Please try again in a few minutes.</p>
    </main>
  </body>
</html>
